services:
  db:
    image: postgres:15-alpine
    container_name: habr_postgres_db
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - my_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: habr_redis_cache
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - my_network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 10s
      retries: 3

  migrator:
    build:
      context: ./habr_adapter
      dockerfile: Dockerfile.good
    image: habr-adapter-image:latest
    container_name: habr_db_migrator
    command: ['python', '-m', 'app.database.init_db']
    depends_on:
      db:
        condition: service_healthy
    networks:
      - my_network
    restart: 'no'

  habr-adapter:
    image: habr-adapter-image:latest
    pull_policy: never
    container_name: habr_adapter_service
    restart: always
    volumes:
      - ./habr_adapter/logs:/app/logs
    env_file:
      - .env
    ports:
      - '${HABR_ADAPTER_PORT}:${HABR_ADAPTER_PORT}'
    networks:
      - my_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    command: ['uvicorn', 'main:app', '--host', '0.0.0.0', '--port', '${HABR_ADAPTER_PORT}']
    healthcheck:
      test: ['CMD-SHELL', 'python -c ''import urllib.request; urllib.request.urlopen("http://localhost:${HABR_ADAPTER_PORT}/health")''']
      interval: 1m
      timeout: 30s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

volumes:
  postgres_data:
  redis_data:

networks:
  my_network:
    driver: bridge
