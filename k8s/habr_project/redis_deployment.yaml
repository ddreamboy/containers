apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-deployment
  labels:
    app: habr-adapter
    tier: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          resources:
            limits:
              memory: "128Mi"
              cpu: "250m"
            requests:
              memory: "64Mi"
              cpu: "100m"
          ports:
            - containerPort: 6379